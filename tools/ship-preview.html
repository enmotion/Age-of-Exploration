<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>船体材质对照</title>
    <link rel="icon" href="data:," />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #192128; color: #e6e3dc; font-family: system-ui, sans-serif; }
      header { padding: 24px 32px 12px; }
      h1 { font-size: 22px; font-weight: 500; margin: 0 0 8px; }
      p { color: #9da9ae; font-size: 13px; margin: 0; }
      main { display: grid; grid-template-columns: 1fr 1fr; }
      section { min-width: 0; position: relative; }
      h2 { position: absolute; left: 32px; top: 12px; font-size: 13px; font-weight: 500; letter-spacing: 1px; }
      canvas { display: block; width: 100%; height: calc(100vh - 100px); }
      #status { position: fixed; bottom: 14px; left: 32px; }
    </style>
  </head>
  <body>
    <header><h1>同一船体 · 材质对照</h1><p>左键旋转 · 滚轮缩放 · 两侧共享相机与光照</p></header>
    <main>
      <section><h2>原始色板</h2><canvas id="before"></canvas></section>
      <section><h2>旧橡木 / 亚麻帆布 / 氧化铁</h2><canvas id="after"></canvas></section>
    </main>
    <p id="status">载入模型…</p>
    <script type="module" src="./ship-preview.mjs"></script>
  </body>
</html>
